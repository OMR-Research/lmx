[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmx"]

[project]
name = "linearized-musicxml"
version = "2.0.0-alpha1"
authors = [
  { name="Jiří Mayer", email="mayer@ufal.mff.cuni.cz" },
]
dependencies = [
    # KEEP THIS EMPTY!
    # There is no reason this light-weight package should
    # depend on anything. Any unnecessary dependency
    # adds potencial problems to package users.
    #
    # If you're adding niche functionality that requires dependencies,
    # list them in a [project.optional-dependencies] section
    # and document that your feature needs this extra dependency
    # installed: pip3 install linearized-musicxml[my-optional-deps]
]
description = "Tokenizer for MusicXML and image-to-sequence models."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/OMR-Research/lmx"
Issues = "https://github.com/OMR-Research/lmx/issues"

[project.gui-scripts]
lmx = "lmx.cli.run:run"
