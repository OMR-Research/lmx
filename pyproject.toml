[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmx"]

[project]
name = "linearized-musicxml"
version = "2.0.0-alpha1"
authors = [
  { name="Jiří Mayer", email="mayer@ufal.mff.cuni.cz" },
]
description = "Tokenizer for MusicXML and image-to-sequence models."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/OMR-Research/lmx"
Issues = "https://github.com/OMR-Research/lmx/issues"

[project.gui-scripts]
lmx = "lmx.cli.run:run"
